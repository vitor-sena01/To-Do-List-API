<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas - Equipe 10</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>✦</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noise"></div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">Equipe 10</span>
            </div>
            <div class="header-stats">
                <span>Pendentes: <strong id="countPendente">0</strong></span>
                <span class="stat-sep">|</span>
                <span>Concluídas: <strong id="countConcluida">0</strong></span>
            </div>
        </div>
    </header>

    <main>
        
        <section class="form-section">
            <h2 class="section-title">Nova Tarefa</h2>
            
            <form id="tarefaForm">
                <div class="field">
                    <label for="tarefa">Tarefa <span class="required">*</span></label>
                    <input type="text" id="tarefa" required placeholder="Ex: Estudar Histologia">
                    <div id="tarefaErro" class="field-error">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        O nome da tarefa não pode estar vazio.
                    </div>
                </div>
                
                <div class="field">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="2" placeholder="Detalhes da tarefa..."></textarea>
                </div>
                
                <div class="field-row">
                    <div class="field">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-add">
                        <span class="btn-icon">+</span>
                        Adicionar
                    </button>
                </div>
            </form>
        </section>

        <section>
            <div class="list-header">
                <h2 class="section-title">Suas Tarefas</h2>
                
                <div class="filters">
                    <button type="button" class="filter-btn active" data-filter="Todas">Todas</button>
                    <button type="button" class="filter-btn" data-filter="Pendente">Pendentes</button>
                    <button type="button" class="filter-btn" data-filter="Concluída">Concluídas</button>
                </div>
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                Nenhuma tarefa encontrada por enquanto.
            </div>

            <div id="listaTarefas"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
